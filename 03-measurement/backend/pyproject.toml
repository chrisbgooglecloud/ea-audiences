[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-ebc-measurement-backend"
version = "1.0.0"
description = "EA Creative Intelligence & Agentic Measurement Engine Backend"
authors = [
    { name = "EA Growth Analytics & MLOps Team", email = "analytics@ea.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "google-genai>=0.1.1",
    "google-cloud-firestore>=2.15.0",
    "google-cloud-bigquery>=3.18.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-aiplatform>=1.43.0",
    "protobuf>=4.25.0",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0.80",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
